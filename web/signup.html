<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeetVault | Sign up</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#10203a;min-height:100vh;display:grid;place-items:center;margin:0}.panel{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border:1px solid #dbe3ef;border-radius:12px;box-shadow:0 12px 36px #10203a18}.brand{font-size:28px;font-weight:800;color:#ff5722}.sub{color:#65748b;margin:8px 0 24px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd6e5;border-radius:7px;font-size:15px;box-sizing:border-box}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:7px;background:#ff5722;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.error{min-height:20px;color:#c62828;margin-top:14px;font-size:13px}.back{display:block;text-align:center;margin-top:18px;color:#ff5722}</style></head><body><main class="panel"><div class="brand">MeetVault</div><div class="sub">Create your personal account</div><form id="form"><label>Full name</label><input id="name" required autocomplete="name"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Create account</button><div class="error" id="error"></div></form><a class="back" href="/login">Back to login</a></main><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='Creating account...';try{const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:name.value,email:email.value,password:password.value,account_type:'personal'})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Registration failed');location.href='/login?created=1'}catch(x){error.textContent=x.message}}</script></body></html>
