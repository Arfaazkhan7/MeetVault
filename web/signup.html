<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MeetVault | Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-light: #EBF3FF;
      --red: #E53935;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
      --bg: #F4F7FC;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .page-wrap {
      width: 100%;
      max-width: 440px;
    }
    .brand-row {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: #0F172A;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .brand-icon svg { width: 28px; height: 28px; fill: #fff; }
    .brand-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -0.03em;
    }
    .brand-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }
    .form-input {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: #FAFBFC;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      background: #fff;
    }
    .pw-wrap { position: relative; }
    .pw-wrap .form-input { padding-right: 46px; }
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }
    .submit-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }
    .submit-btn:hover { background: var(--blue-dark); }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .msg {
      min-height: 22px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 14px;
      text-align: center;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .msg.error { color: var(--red); }
    .msg.success { color: #16a34a; }
    .password-strength {
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }
    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .footer-link a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }
    .footer-link a:hover { text-decoration: underline; }
    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: 600;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--blue); }
    .terms {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 16px;
      line-height: 1.5;
    }
  
    .google-btn {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s ease;
      margin-bottom: 18px;
    }
    .google-btn:hover {
      background: #F8FAFC;
      border-color: #CBD5E1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

  </style>
</head>
<body>
  <div class="page-wrap">
    <a href="index.html" class="back-link">
      ← Back to MeetVault
    </a>

    <div class="brand-row">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </div>
      <div class="brand-name">MeetVault</div>
      <div class="brand-sub">Smart meeting memory & collaboration</div>
    </div>

    <div class="card">
      <div class="card-title">Create your account 🚀</div>
      <div class="card-sub">Join MeetVault and never miss a meeting detail again</div>


      <button type="button" class="google-btn" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.87 10.78c-.19-.58-.3-1.2-.3-1.78s.11-1.2.3-1.78L.97 4.96C.35 6.18 0 7.55 0 9s.35 2.82.97 4.04l2.9-2.26z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.9 2.26C4.59 5.05 6.62 3.58 9 3.58z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="divider">or sign in with email</div>


      <form id="signupForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input class="form-input" id="name" type="text" placeholder="Arfaaz Khan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" id="email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="pw-wrap">
            <input class="form-input" id="password" type="password" placeholder="Min 6 characters" required autocomplete="new-password" minlength="6" oninput="updateStrength(this.value)">
            <button type="button" class="pw-toggle" id="pw-eye" aria-label="Show password">👁️</button>
          </div>
          <div class="password-strength">
            <div class="strength-bar" id="strength-bar"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password</label>
          <div class="pw-wrap">
            <input class="form-input" id="confirm" type="password" placeholder="Repeat your password" required autocomplete="new-password">
            <button type="button" class="pw-toggle" id="confirm-eye" aria-label="Show password">👁️</button>
          </div>
        </div>

        <button class="submit-btn" type="submit" id="submit-btn">Create Account</button>
        <div class="msg" id="msg"></div>
      </form>

      <p class="terms">By creating an account, you agree to our Terms of Service and Privacy Policy.</p>

      <div class="footer-link">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    // Password toggle for main password
    const pwInput = document.getElementById('password');
    const pwEye = document.getElementById('pw-eye');
    pwEye.onclick = () => {
      const show = pwInput.type === 'text';
      pwInput.type = show ? 'password' : 'text';
      pwEye.textContent = show ? '👁️' : '🙈';
    };

    // Password toggle for confirm
    const confirmInput = document.getElementById('confirm');
    const confirmEye = document.getElementById('confirm-eye');
    confirmEye.onclick = () => {
      const show = confirmInput.type === 'text';
      confirmInput.type = show ? 'password' : 'text';
      confirmEye.textContent = show ? '👁️' : '🙈';
    };

    // Redirect if already logged in
    if (localStorage.getItem('mv_user')) {
      window.location.href = 'index.html';
    }

    function updateStrength(val) {
      const bar = document.getElementById('strength-bar');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const pct = (score / 5) * 100;
      bar.style.width = pct + '%';
      bar.style.background = score <= 1 ? '#EF4444' : score <= 3 ? '#F59E0B' : '#22C55E';
    }

    const form = document.getElementById('signupForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!name || !email || !password || !confirm) {
        msg.className = 'msg error';
        msg.textContent = 'Please fill in all fields.';
        return;
      }
      if (password.length < 6) {
        msg.className = 'msg error';
        msg.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (password !== confirm) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      // Try real API first
      try {
        const r = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name: name, email, password, account_type: 'personal' }),
          signal: AbortSignal.timeout(3000)
        });
        const d = await r.json();
        if (r.ok) {
          // Try auto-login
          try {
            const r2 = await fetch('/api/v1/auth/login/personal', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password }),
              signal: AbortSignal.timeout(3000)
            });
            const d2 = await r2.json();
            if (r2.ok) {
              localStorage.setItem('access_token', d2.access_token);
              if (d2.refresh_token) localStorage.setItem('refresh_token', d2.refresh_token);
            }
          } catch (_) {}
          saveUser(email, name);
          return;
        }
        // API returned error
        btn.disabled = false;
        btn.textContent = 'Create Account';
        msg.className = 'msg error';
        const m = Array.isArray(d.detail) ? d.detail.map(x => x.msg || JSON.stringify(x)).join(', ') : d.detail;
        msg.textContent = m || 'Registration failed. Please try again.';
        return;
      } catch (_) {
        // No backend — use local storage
      }

      // Local registration
      const users = JSON.parse(localStorage.getItem('mv_users') || '{}');
      if (users[email]) {
        btn.disabled = false;
        btn.textContent = 'Create Account';
        msg.className = 'msg error';
        msg.textContent = 'An account with this email already exists. Try signing in.';
        return;
      }

      users[email] = password;
      localStorage.setItem('mv_users', JSON.stringify(users));
      saveUser(email, name);
    };

    
    function loginWithGoogle() {
      const googleEmail = 'alex.dev@gmail.com';
      const googleName = 'Alex Mercer';
      const code = 'MTG-GOOG1';
      localStorage.setItem('mv_user', JSON.stringify({ email: googleEmail, name: googleName, code: code }));
      localStorage.setItem('access_token', 'google-oauth-demo-' + Date.now());
      const msg = document.getElementById('msg');
      if (msg) {
        msg.className = 'msg success';
        msg.textContent = '✅ Signed up with Google! Redirecting…';
      }
      setTimeout(() => { window.location.href = 'index.html'; }, 600);
    }

    function saveUser(email, name) {
      if (!name) name = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const code = 'MTG-' + Math.random().toString(36).substring(2, 7).toUpperCase();
      localStorage.setItem('mv_user', JSON.stringify({ email, name, code }));
      localStorage.setItem('access_token', 'mv-local-' + Date.now());
      msg.className = 'msg success';
      msg.textContent = '✅ Account created! Welcome to MeetVault!';
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    }
  </script>
</body>
</html>
