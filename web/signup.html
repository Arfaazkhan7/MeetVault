<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeetVault | Sign up</title><style>body{font-family:Arial;background:#f5f7fb;color:#10203a;display:grid;place-items:center;min-height:100vh}.panel{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border:1px solid #dbe3ef;border-radius:12px}.brand{font-size:28px;font-weight:bold;color:#ff5722}input{width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box}button{width:100%;padding:13px;background:#ff5722;color:white;border:0;border-radius:7px;font-weight:bold}.error{color:#c62828;min-height:20px}</style></head>
<body><main class="panel"><div class="brand">MeetVault</div><p>Create your personal account</p><form id="form"><label>Full name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><button type="submit">Create account</button><p class="error" id="error"></p></form><a href="/login">Back to login</a></main><script>const form=document.getElementById('form'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();error.textContent='Creating account...';const email=document.getElementById('email').value,password=document.getElementById('password').value;try{let r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:document.getElementById('name').value,email,password,account_type:'personal'})});let d=await r.json();if(!r.ok){const m=Array.isArray(d.detail)?d.detail.map(x=>x.msg||JSON.stringify(x)).join(', '):d.detail;throw Error(m||'Registration failed')}error.textContent='Signing you in...';r=await fetch('/api/v1/auth/login/personal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});d=await r.json();if(!r.ok)throw Error(d.detail||'Account created, but automatic login failed');localStorage.setItem('access_token',d.access_token);localStorage.setItem('refresh_token',d.refresh_token);location.href='/';}catch(x){error.textContent=x.message||'Registration failed'}};</script></body></html>
