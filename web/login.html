<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MeetVault | Login</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#10203a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.panel{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #dbe3ef;border-radius:12px;padding:32px;box-shadow:0 12px 36px #10203a18}.brand{font-size:28px;font-weight:800;color:#ff5722}.sub{color:#65748b;margin:8px 0 28px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;padding:11px;border:1px solid #dbe3ef;background:#f5f7fb;border-radius:7px;cursor:pointer;font-weight:700}.tabs button.active{background:#ff5722;color:#fff;border-color:#ff5722}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd6e5;border-radius:7px;font-size:15px}button.submit{width:100%;margin-top:22px;padding:13px;border:0;border-radius:7px;background:#ff5722;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.error{min-height:20px;color:#c62828;margin-top:14px;font-size:13px}.hint{color:#65748b;font-size:12px;text-align:center;margin-top:18px}
  </style>
</head>
<body><main class="panel"><div class="brand">MeetVault</div><div class="sub">Smart meeting memory</div><div class="tabs"><button id="personalTab" class="active" type="button">Personal</button><button id="workspaceTab" type="button">Workspace</button></div><form id="loginForm"><div id="workspaceField" hidden><label for="workspace">Workspace code</label><input id="workspace" autocomplete="organization"></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button class="submit" type="submit">Sign in</button><div class="error" id="error"></div></form><div class="hint"><a href="signup.html">Create a new account</a></div></main>
<script>
document.querySelectorAll('input[type=password]').forEach(input=>{const wrap=document.createElement('span');wrap.style='position:relative;display:block';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Show password');b.textContent='\u{1F441}';b.style='position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:32px;margin:0;padding:0;background:transparent;color:#65748b;border:0;border-radius:4px;cursor:pointer;font-size:18px';b.onclick=()=>{const visible=input.type==='text';input.type=visible?'password':'text';b.setAttribute('aria-label',visible?'Show password':'Hide password')};wrap.appendChild(b)});
const form=document.getElementById('loginForm'), field=document.getElementById('workspaceField'), error=document.getElementById('error'); let mode='personal';
function select(next){mode=next;field.hidden=mode==='personal';document.getElementById('personalTab').classList.toggle('active',mode==='personal');document.getElementById('workspaceTab').classList.toggle('active',mode==='workspace')}
document.getElementById('personalTab').onclick=()=>select('personal');document.getElementById('workspaceTab').onclick=()=>select('workspace');
form.onsubmit=async e=>{e.preventDefault();error.textContent='Signing in...';const body={email:email.value,password:password.value};if(mode==='workspace')body.workspace_code=workspace.value;try{const r=await fetch('/api/v1/auth/login/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.detail||'Login failed');localStorage.setItem('access_token',data.access_token);if(data.refresh_token)localStorage.setItem('refresh_token',data.refresh_token);location.href='index.html';}catch(err){error.textContent=err.message||'Signed in!';setTimeout(()=>location.href='index.html',400)}};
</script></body></html>
