name: Test native Cloudflare backend
on:
  push:
    branches: [main]
    paths: ['cloudflare_native/**', 'web/**', 'translation_speech/**', 'supabase/migrations/**', '.github/workflows/test-native-worker.yml']
  pull_request:
    paths: ['cloudflare_native/**', 'web/**', 'translation_speech/**', 'supabase/migrations/**', '.github/workflows/test-native-worker.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare_native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare_native/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --minify
      - name: Test shared speech service API and cache
        working-directory: translation_speech
        run: python3 -m unittest -v test_server.py
