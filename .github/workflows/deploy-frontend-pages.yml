name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Web Directory & Inject Config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          API_BASE_URL: https://meetvault-api.onrender.com/api/v1
        run: |
          mkdir -p dist
          cp -r web/* dist/
          touch dist/.nojekyll

          node <<'NODE'
          const fs = require('fs');
          const files = ['dist/login.html', 'dist/signup.html', 'dist/index.html', 'dist/admin.html'];
          const firebaseApiKey = process.env.FIREBASE_API_KEY || '';
          const apiBaseUrl = process.env.API_BASE_URL || 'https://meetvault-api.onrender.com/api/v1';

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            let text = fs.readFileSync(file, 'utf8');
            if (firebaseApiKey) {
              text = text.replaceAll('__FIREBASE_API_KEY__', firebaseApiKey);
            }
            text = text.replaceAll('__API_BASE_URL__', apiBaseUrl);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        continue-on-error: true
        with:
          channel: stable

      - name: Build Flutter Web App
        continue-on-error: true
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          mkdir -p ../dist/flutter
          cp -r build/web/* ../dist/flutter/ || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

