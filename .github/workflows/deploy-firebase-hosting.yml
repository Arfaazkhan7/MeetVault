name: Deploy Flutter Web to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production FastAPI base URL, for example https://meetvault-api.run.app/api/v1
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

      - name: Build Flutter web
        working-directory: frontend
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL="${{ github.event.inputs.api_base_url }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="ai-meet-f8fd0.firebaseapp.com" \
            --dart-define=FIREBASE_PROJECT_ID="ai-meet-f8fd0" \
            --dart-define=FIREBASE_STORAGE_BUCKET="ai-meet-f8fd0.firebasestorage.app" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="661020533786" \
            --dart-define=FIREBASE_APP_ID="1:661020533786:web:ef4fd4bdd3c72a8e6c5da3" \
            --dart-define=FIREBASE_MEASUREMENT_ID="G-C5KTB28SWG"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_MEET_F8FD0 }}"
          channelId: live
          projectId: ai-meet-f8fd0
