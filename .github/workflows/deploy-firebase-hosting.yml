name: Deploy Web to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject production web config
        id: inject-config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          API_BASE_URL: https://meetvault-api-candidate.aeris-cloud.workers.dev/api/v1
        run: |
          node <<'NODE'
          const fs = require('fs');
          const firebaseApiKey = process.env.FIREBASE_API_KEY || '';
          const apiBaseUrl = process.env.API_BASE_URL || '';

          if (!/^AIza[0-9A-Za-z_-]{20,}$/.test(firebaseApiKey)) {
            console.log('::warning::FIREBASE_API_KEY secret is not configured in this repository. Skipping Firebase hosting deployment.');
            const outputFile = process.env.GITHUB_OUTPUT;
            if (outputFile) fs.appendFileSync(outputFile, 'configured=false\n');
            process.exit(0);
          }

          const files = ['web/login.html', 'web/signup.html', 'web/index.html', 'web/admin.html'];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            text = text.replaceAll('__FIREBASE_API_KEY__', firebaseApiKey);
            text = text.replaceAll('__API_BASE_URL__', apiBaseUrl);
            fs.writeFileSync(file, text);
          }

          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) fs.appendFileSync(outputFile, 'configured=true\n');
          NODE

      - name: Deploy to Firebase Hosting
        if: steps.inject-config.outputs.configured == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_MEET_F8FD0 }}"
          channelId: live
          projectId: ai-meet-f8fd0

