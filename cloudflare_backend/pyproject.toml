[project]
name = "meetvault-cloudflare-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  # The free-tier Worker uses Workers AI; the optional OpenAI SDK remains
  # available in native backend requirements rather than this Worker bundle.
  "fastapi", "pydantic-settings", "pydantic[email]", "sqlalchemy",
  "pg8000", "pgvector", "python-jose", "asn1crypto",
  "livekit-api", "httpx", "python-multipart", "pypdf",
  "python-dotenv",
]

[dependency-groups]
dev = ["workers-py==1.17.8", "workers-runtime-sdk"]
