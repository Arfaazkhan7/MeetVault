databases:
  - name: meetvault-db
    plan: free
    region: oregon
    version: 16

services:
  - type: web
    name: meetvault-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://ai-meet-f8fd0.web.app,https://ai-meet-f8fd0.firebaseapp.com
      - key: FIREBASE_PROJECT_ID
        value: ai-meet-f8fd0
      - key: API_BASE_URL
        value: https://meetvault-api.onrender.com/api/v1
      - key: FRONTEND_PUBLIC_URL
        value: https://ai-meet-f8fd0.web.app
      - key: AI_WORKER_QUEUE
        value: database
      - key: LIVEKIT_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: meeting-recordings
      - key: RECORDING_SIGNED_URL_EXPIRE_SECONDS
        value: "900"
      - key: MAX_RECORDING_UPLOAD_BYTES
        value: "524288000"
      - key: LLM_PROVIDER
        value: openai
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: meetvault-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
  - type: worker
    name: meetvault-ai-worker
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./ai_worker/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: meeting-recordings
      - key: LLM_PROVIDER
        value: openai
      - key: TRANSCRIPTION_PROVIDER
        value: openai
      - key: ANALYSIS_PROVIDER
        value: openai
      - key: AI_WORKER_QUEUE
        value: database
      - key: AI_WORKER_POLL_INTERVAL_SECONDS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: meetvault-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
